services:
  # 教务业务后端
  api:
    build: .
    command: python -m uvicorn backend.main:app --host 0.0.0.0 --port 8811
    ports:
      - "8811:8811"
    volumes:
      - ./data:/app/data
      - ./outputs:/app/outputs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8811/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Streamlit 界面
  ui:
    build: .
    command: python -m streamlit run app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy
    environment:
      CAMPUS_API_BASE_URL: http://api:8811
    volumes:
      - ./data:/app/data
      - ./outputs:/app/outputs
